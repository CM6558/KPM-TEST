name: Build KPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Clone SukiSU KernelPatch
        run: git clone --depth=1 https://github.com/ShirkNeko/SukiSU_KernelPatch_patch.git KernelPatch

      - name: Build
        env:
          NDK_PATH: ${{ steps.setup_ndk.outputs.ndk-path }}
          KP_DIR: ${{ github.workspace }}/KernelPatch
        run: make

      # 门: 产物静态自检 (ET_REL/AArch64 + .kpm.* 节 + 未定义符号白名单)。
      # 未定义符号只允许 kf_* (KP kfunc 桩) 与固定 KP 导出集合 ——
      # 任何新增外部依赖都必须先核对 KP 导出表, 否则加载期 "unknown symbol" 拒绝。
      - name: Check KPM artifact
        run: sh scripts/check_kpm.sh hero_reader.kpm

      - name: Verify output
        run: |
          file hero_reader.kpm
          ls -lh hero_reader.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero_reader-kpm
          path: |
            hero_reader.kpm
            hero_reader.sh
          retention-days: 90

      - name: Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hero_reader.kpm
            hero_reader.sh
          draft: false
          prerelease: false
